<!-- Plantilla de Supabase Auth (enlace de acceso). Copiar en Authentication › Email Templates › Magic link.
     El enlace usa token_hash: funciona aunque el email se abra en otro navegador o dispositivo. -->
<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2937">
  <h2 style="color:#2f6468;font-weight:600">Tu enlace de acceso</h2>
  <p>Usá este enlace para ingresar a la plataforma de pacientes.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=magiclink&next=/bienvenida"
       style="background:#2f6468;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;display:inline-block">Ingresar</a>
  </p>
  <p style="font-size:13px;color:#6b7280">El enlace se puede usar una sola vez y vence después de un tiempo. Si no lo pediste, ignorá este correo.</p>
</div>
