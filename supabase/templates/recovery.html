<!-- Plantilla de Supabase Auth (recuperación de contraseña). Copiar en Authentication › Email Templates › Reset password.
     El enlace usa token_hash: funciona aunque el email se abra en otro navegador o dispositivo. -->
<div style="font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2937">
  <h2 style="color:#1f4e5f;font-weight:600">Cambiar tu contraseña</h2>
  <p>Recibimos un pedido para cambiar la contraseña de tu cuenta.</p>
  <p style="margin:28px 0">
    <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
       style="background:#1f4e5f;color:#ffffff;padding:12px 20px;border-radius:10px;text-decoration:none;display:inline-block">Elegir una contraseña nueva</a>
  </p>
  <p style="font-size:13px;color:#6b7280">El enlace se puede usar una sola vez y vence después de un tiempo. Si no lo pediste, ignorá este correo: tu contraseña sigue igual.</p>
</div>
