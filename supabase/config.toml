# Configuración mínima del CLI de Supabase para desarrollo local.
# Documentación: https://supabase.com/docs/guides/local-development/cli/config
project_id = "psicologia-matias-sanchez"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Alta de pacientes únicamente por invitación del profesional.
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"

# Enlaces con token_hash hacia /auth/callback (funcionan aunque el email se abra en otro
# navegador). En el proyecto real se copian en Authentication › Email Templates.
[auth.email.template.invite]
subject = "Tu invitación a la plataforma de pacientes"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Cambiar tu contraseña"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.magic_link]
subject = "Tu enlace de acceso"
content_path = "./supabase/templates/magic_link.html"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.rate_limit]
email_sent = 4
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[storage]
enabled = true
file_size_limit = "50MiB"
